# Infra (sempre):            docker compose up -d
# + 3 instâncias da app:     docker compose --profile app up -d --build
name: jungle-wagering

x-app: &app
  build: .
  init: true # repassa SIGTERM corretamente para o processo Bun
  stop_grace_period: 30s # tempo para terminar mensagens em andamento
  restart: unless-stopped
  profiles: ["app"]
  environment:
    DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://localstack:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    LOG_LEVEL: info
  depends_on:
    migrate:
      condition: service_completed_successfully
    localstack:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5432:5432"]
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 2s
      retries: 30

  # Emulador de SQS. Versão fixada: a imagem "latest" do LocalStack passou a
  # exigir auth token em 2026. Alternativa: trocar por MiniStack (ver README).
  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health"]
      interval: 3s
      retries: 40

  # Roda as migrations UMA vez, antes das instâncias subirem.
  migrate:
    build: .
    profiles: ["app"]
    command: ["bun", "run", "migration:up"]
    environment:
      DATABASE_URL: postgres://wagering:wagering@postgres:5432/wagering
    depends_on:
      postgres:
        condition: service_healthy

  app-1:
    <<: *app
    ports: ["3001:3000"]
  app-2:
    <<: *app
    ports: ["3002:3000"]
  app-3:
    <<: *app
    ports: ["3003:3000"]
